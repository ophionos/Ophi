name: CI

# Lean by design: each job runs only when a PR touches what it can catch (see `changes`). No
# push-to-main run — with squash merges it repeated the PR's own run. The weekly schedule runs
# everything once, so drift that no PR touches (base images, the merged combination) still surfaces.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.githooks/**'
      - 'LICENSE'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'backend=true\nfrontend=true\ndocker=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          hit() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          wf='|^\.github/workflows/ci\.yml$'
          {
            echo "backend=$(hit "^(src/Ophi\.(Api|Domain|Infrastructure|Worker)/|tests/|Directory\.|global\.json|Ophi\.slnx|\.editorconfig)$wf")"
            echo "frontend=$(hit "^src/Ophi\.Web/$wf")"
            # Only what can break an image build but not a plain build: the Dockerfiles, the root
            # build-config files they copy, and project files (a new reference the images don't copy).
            echo "docker=$(hit "^(docker/|\.dockerignore|Directory\.Build\.|global\.json|\.editorconfig|nuget\.config|src/[^/]+/[^/]+\.csproj$)$wf")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    name: Backend (.NET)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Postgres tier (Ophi.Postgres.Tests) reads POSTGRES_TEST_CONNECTION and creates an isolated
      # database per run. Provided here so the tier doesn't fall back to Testcontainers (avoids an
      # extra image pull at test time).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Runs on Microsoft.Testing.Platform, not VSTest (global.json `test.runner`), so the flags
        # are MTP/xunit.v3 spellings:
        #   --filter-not-trait  replaces --filter "Category!=Integration", excluding
        #     PlaywrightBrowserManagerTests, which launch a real Chromium and need `playwright
        #     install` that CI does not provide. xunit.v3 4.0.0 does still accept the VSTest
        #     --filter grammar, but it can't be combined with the --filter-* family, so the native
        #     spelling is the one to build on. Verified as a real exclusion, not a no-op:
        #     Ophi.Infrastructure.Tests discovers 636 unfiltered, 629 with this flag, and 7 with
        #     --filter-trait "Category=Integration".
        #   --report-xunit-trx  replaces --logger "trx;..." (--logger is gone). This is xunit.v3's
        #     own TRX reporter, so it is version-locked to xunit.v3 and needs no
        #     Microsoft.Testing.Extensions.TrxReport. The filename is left at its default
        #     (user_machine_timestamp) — a fixed LogFileName would make the test projects overwrite
        #     one file. Each TRX records its assembly in codeBase, so attribution survives.
        #   --results-directory pins where those reports land. MTP's default is per-test-app, and
        #     `dotnet test` overrides it to the working directory; pinning keeps it in step with the
        #     upload path below rather than depending on that default.
        #   --logger "console;verbosity=normal" maps to nothing: MTP's --output already defaults to
        #     Normal, which is that logger's behaviour.
        env:
          POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: dotnet test --no-build --configuration Release --filter-not-trait "Category=Integration" --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        # MTP writes every project's report into the one --results-directory above, rather than
        # VSTest's per-project <project>/TestResults/ — hence a flat path, not a '**/' glob.
        with:
          name: backend-test-results
          path: 'TestResults/*.trx'

      - name: Vulnerable package scan
        run: |
          set -o pipefail
          output=$(dotnet list package --vulnerable --include-transitive 2>&1 | tee /dev/stderr)
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  frontend:
    name: Frontend (SvelteKit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Ophi.Web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as the Docker images: package.json `packageManager` mirrors the oven/bun tag.
          bun-version-file: src/Ophi.Web/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        # `bun run build` does not type-check, so type errors (e.g. calling a
        # non-existent API-client method) can ship and only 500 at runtime.
        run: bun run check

      - name: Unit tests
        run: bun run test:run

      - name: Lint
        # Blocking, warnings included (--max-warnings 0): the baseline is 0 errors / 0 warnings.
        run: bun run lint --max-warnings 0

      - name: Build
        # svelte-check + vitest both pass SvelteKit build-time errors (e.g. an
        # illegal non-`_` export from a +page.ts, which 500s the route AND fails
        # the adapter `analyse` step). Only `bun run build` catches that class, so
        # it gates here — otherwise an un-deployable tree merges green.
        # client.ts reads VITE_API_URL at import time and throws if unset, and the
        # postbuild analyse step imports it — mirror the production web image value.
        env:
          VITE_API_URL: /api/v1
        run: bun run build

  docker:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The source builds above do NOT exercise the Dockerfiles. Twice, main became undeployable while
    # CI was green: a shared build-config file was not copied before `dotnet restore`, and a
    # `src/`-anchored .editorconfig glob missed the container's flattened layout
    # (`src/Ophi.Infrastructure/` -> `/src/Ophi.Infrastructure/`). Only a build through the actual
    # Dockerfile catches that class, which is why `changes` runs this job only for Dockerfile,
    # root build-config, and project-file changes.
    #
    # Coverage per entry: `worker` builds its full runtime stage (Chromium install, the Playwright node
    # path); `api` and `web` build their `build` stage, which runs the publish.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: docker/Dockerfile.api, target: build, platform: linux/amd64, runner: ubuntu-latest }
          - { name: web, file: docker/Dockerfile.web, target: build, platform: linux/amd64, runner: ubuntu-latest }
          - { name: worker, file: docker/Dockerfile.worker, target: runtime, platform: linux/amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
