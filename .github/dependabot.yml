version: 2
# Lean on purpose. Version updates come monthly, and every minor/patch bump of an ecosystem lands
# in ONE grouped PR (separate PRs for adjacent Directory.Packages.props lines conflicted with each
# other). Majors still get their own PR, grouped by family, because they need release-note review.
# Security updates are not affected by this schedule: they open as soon as an advisory appears.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # First match wins, so the catch-all for minor/patch goes first.
      nuget-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      microsoft-aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      microsoft-entityframeworkcore:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
      wolverine:
        patterns:
          - "WolverineFx*"
      xunit:
        patterns:
          - "xunit*"

  - package-ecosystem: "npm"
    directory: "/src/Ophi.Web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      sveltekit:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dotnet:
        patterns:
          - "mcr.microsoft.com/dotnet/*"
      bun:
        patterns:
          - "oven/bun"
