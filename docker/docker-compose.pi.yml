# Pi deployment: single .NET container (API + Worker) with static frontend.
# Caddy runs on the host separately — see Caddyfile.pi for reference config.
#
# Setup:
#   1. Build the image:
#        docker compose -f docker/docker-compose.pi.yml build
#      Or cross-compile from another machine:
#        docker buildx build --platform linux/arm64 -f docker/Dockerfile.pi -t ophi:pi --load .
#
#   2. Extract static files for Caddy to serve:
#        docker compose -f docker/docker-compose.pi.yml run --rm --entrypoint "" ophi \
#          cp -r /app/static /tmp/static
#      Or manually:
#        CID=$(docker create ophi:pi) && docker cp $CID:/app/static ./static && docker rm $CID
#
#   3. Point Caddy's root to the extracted static/ directory.
#
#   4. Start the service:
#        docker compose -f docker/docker-compose.pi.yml up -d

services:
  db:
    image: postgres:16-alpine
    volumes:
      - ophi-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ophi
      - POSTGRES_USER=ophi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ophi}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ophi -d ophi"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  ophi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pi
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Postgres everywhere — the Pi runs an embedded worker + a local Postgres (heavier than the
      # old SQLite file, but migrations are Postgres-only now). Mind the total memory budget below.
      - DB_PROVIDER=postgres
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=ophi;Username=ophi;Password=${POSTGRES_PASSWORD:-ophi}
      - ENABLE_WORKER=true
      - DISABLE_PLAYWRIGHT=true
      - APP_URL=${APP_URL:-http://localhost}
      # Caddy on the host reaches the published 127.0.0.1:5000 through docker-proxy, so the API
      # sees the bridge gateway, not loopback. Trust the bridge so Caddy's X-Forwarded-For is used
      # for per-IP rate limits; the port is bound to 127.0.0.1, so only host processes can spoof it.
      - ForwardedHeaders__KnownIPNetworks=${FORWARDED_HEADERS_KNOWN_NETWORKS:-172.16.0.0/12}
      # Set false once your own account exists to stop anyone else signing up (docs/security.md).
      - Registration__Enabled=${REGISTRATION_ENABLED:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - PUSHOVER_APP_TOKEN=${PUSHOVER_APP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ophi-db:
