<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Offline - Ophi</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box}
		body{
			font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
			min-height:100vh;display:flex;align-items:center;justify-content:center;
			background:#f9fafb;color:#111827;text-align:center;padding:2rem;
		}
		@media(prefers-color-scheme:dark){
			body{background:#111827;color:#f9fafb}
			.card{background:#1f2937;border-color:#374151}
			.btn{background:#6366f1;color:#fff}
			.btn:hover{background:#4f46e5}
		}
		.card{
			max-width:24rem;padding:2rem;border-radius:0.75rem;
			border:1px solid #e5e7eb;background:#fff;
		}
		.icon{font-size:3rem;margin-bottom:1rem}
		h1{font-size:1.25rem;font-weight:600;margin-bottom:0.5rem}
		p{font-size:0.875rem;color:#6b7280;margin-bottom:1.5rem;line-height:1.5}
		@media(prefers-color-scheme:dark){p{color:#9ca3af}}
		.btn{
			display:inline-block;padding:0.5rem 1.5rem;border-radius:0.5rem;
			font-size:0.875rem;font-weight:500;text-decoration:none;
			background:#6366f1;color:#fff;border:none;cursor:pointer;
		}
		.btn:hover{background:#4f46e5}
		.brand{font-size:0.75rem;color:#9ca3af;margin-top:1.5rem}
	</style>
</head>
<body>
	<div class="card">
		<div class="icon" role="img" aria-label="No connection">&#x1F50C;</div>
		<h1>You're offline</h1>
		<p>It looks like you've lost your internet connection. Check your network and try again.</p>
		<button class="btn" onclick="window.location.reload()">Try Again</button>
		<div class="brand">Ophi &mdash; Price Tracker</div>
	</div>
</body>
</html>
